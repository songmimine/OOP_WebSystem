<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LPU Cavite | Laboratory Equipment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin_header.css" />
</head>
<body>

  <!-- ===== Admin header component (start) ===== -->
  <div class="admin-header" data-admin-header>

    <!-- Top bar -->
    <header class="ah-topbar">

      <a class="ah-brand" href="#" aria-label="LPU Cavite Laboratory Equipment System">
        <img class="ah-brand__logo" src="assets/lpu-cavite-logo.png" alt="Lyceum of the Philippines University Cavite" width="144" height="62" />
        <span class="ah-brand__divider" aria-hidden="true"></span>
        <span class="ah-brand__title">LABORATORY<br />EQUIPMENT SYSTEM</span>
      </a>

      <form class="ah-search" data-ah-search role="search">
        <span class="ah-search__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </span>
        <input class="ah-search__input" data-ah-search-input type="search" placeholder="Search equipment, requests, or ID..." autocomplete="off" aria-label="Search equipment, requests, or ID" />
        <button class="ah-search__btn" type="submit">
          <span>Search</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </button>
      </form>

      <div class="ah-utility">
        <div class="ah-datetime" data-ah-datetime data-live="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>
          <span data-ah-date>Oct 26, 2025</span>
          <span class="ah-datetime__sep" aria-hidden="true"></span>
          <span data-ah-time>7:45 PM</span>
        </div>

        <button class="ah-bell" data-ah-bell type="button" aria-label="Notifications, 3 unread">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="ah-bell__badge" data-ah-badge>3</span>
        </button>

        <span class="ah-utility__divider" aria-hidden="true"></span>

        <div class="ah-user">
          <span class="ah-user__avatar" aria-hidden="true">DR</span>
          <span class="ah-user__meta">
            <strong class="ah-user__name">Dr. Aris Thorne</strong>
            <small class="ah-user__role">Admin</small>
          </span>
        </div>
      </div>
    </header>

    <!-- Navigation bar -->
    <nav class="ah-nav" aria-label="Primary">
      <ul class="ah-nav__list">
        <li>
          <a class="ah-nav__link" href="#admin-dashboard">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8 2.5 11.4a.8.8 0 0 0 .5 1.4H5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-7.2h2a.8.8 0 0 0 .5-1.4L12 2.8Z"/></svg>
            <span>Admin Dashboard</span>
          </a>
        </li>
        <li>
          <a class="ah-nav__link" href="#equipment-management">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.2L4.6 18.4A1.8 1.8 0 0 0 6.2 21h11.6a1.8 1.8 0 0 0 1.6-2.6L14 9.2V3"/><path d="M7.2 14.5h9.6"/></svg>
            <span>Equipment Management</span>
          </a>
        </li>
        <li>
          <a class="ah-nav__link" href="#borrowing-requests">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4.5" width="14" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="4" rx="1"/><path d="M9 11.5h6M9 15.5h6"/></svg>
            <span>Borrowing Requests</span>
          </a>
        </li>
        <li>
          <a class="ah-nav__link" href="#return-management">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.5 2.5v4h-4M5.5 21.5v-4h4"/></svg>
            <span>Return Management</span>
          </a>
        </li>
        <li>
          <a class="ah-nav__link" href="#records-history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5h10a1.5 1.5 0 0 1 1.5 1.5v13a3 3 0 0 1-3 3H6.5a3 3 0 0 1-3-3v-1.5H14v1.5a1.5 1.5 0 0 0 3 0"/><path d="M8 3.5A1.5 1.5 0 0 0 6.5 5v12.5M10.5 8h6M10.5 12h6"/></svg>
            <span>Records &amp; History</span>
          </a>
        </li>
      </ul>
    </nav>

  </div>
  <!-- ===== Admin header component (end) ===== -->

  <script src="admin_header.js"></script>
</body>
</html>
