<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome, Admin | Laboratory Equipment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin_welcome.css">
</head>
<body>

  <!-- Top banner -->
  <header class="header">
    <img class="header__logo" src="../assets/lpu-logo-white.png" alt="Lyceum of the Philippines University Cavite">
    <span class="header__divider" aria-hidden="true"></span>
    <span class="header__title">LABORATORY<br>EQUIPMENT SYSTEM</span>
  </header>

  <!-- Main content -->
  <main class="main">
    <div class="welcome">

      <!-- Molecule icon: gray base + dark blue layer that fills up bottom to top -->
      <div class="molecule" aria-hidden="true">

        <!-- Shared molecule shape (drawn once, used by both layers) -->
        <svg width="0" height="0" style="position:absolute">
          <defs>
            <symbol id="molecule-shape" viewBox="0 0 120 95">
              <g fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
                <!-- hexagons -->
                <polygon points="40,23 52.1,30 52.1,44 40,51 27.9,44 27.9,30"/>
                <polygon points="76,22 84.7,27 84.7,37 76,42 67.3,37 67.3,27"/>
                <polygon points="12,3 18.9,7 18.9,15 12,19 5.1,15 5.1,7"/>
                <polygon points="26,58 32.9,62 32.9,70 26,74 19.1,70 19.1,62"/>
                <polygon points="99,45 106.8,49.5 106.8,58.5 99,63 91.2,58.5 91.2,49.5"/>
                <polygon points="86,70 94.7,75 94.7,85 86,90 77.3,85 77.3,75"/>
                <!-- bonds -->
                <line x1="40"    y1="23"   x2="50"  y2="15"/>
                <line x1="52.1"  y1="35"   x2="67.3" y2="32"/>
                <line x1="76"    y1="22"   x2="86"  y2="14"/>
                <line x1="84.7"  y1="37"   x2="93"  y2="50"/>
                <line x1="27.9"  y1="44"   x2="11"  y2="42"/>
                <line x1="40"    y1="51"   x2="56"  y2="56"/>
                <line x1="35"    y1="50"   x2="30"  y2="59"/>
                <line x1="18.9"  y1="15"   x2="27.9" y2="30"/>
                <line x1="106.8" y1="58.5" x2="113" y2="67"/>
                <line x1="91.2"  y1="58.5" x2="77"  y2="58"/>
                <line x1="95"    y1="63"   x2="91"  y2="71"/>
                <line x1="77.3"  y1="85"   x2="64"  y2="85"/>
              </g>
              <g fill="currentColor">
                <circle cx="50"  cy="15" r="3.8"/>
                <circle cx="86"  cy="14" r="3.8"/>
                <circle cx="11"  cy="42" r="3.8"/>
                <circle cx="56"  cy="56" r="3.8"/>
                <circle cx="113" cy="67" r="3.8"/>
                <circle cx="77"  cy="58" r="3.8"/>
                <circle cx="64"  cy="85" r="3.8"/>
              </g>
            </symbol>
          </defs>
        </svg>

        <svg class="molecule__layer molecule__base" viewBox="0 0 120 95"><use href="#molecule-shape"/></svg>
        <svg class="molecule__layer molecule__fill" viewBox="0 0 120 95"><use href="#molecule-shape"/></svg>
      </div>

      <h1 class="welcome__title">Welcome, Admin!</h1>
      <p class="welcome__subtitle" role="status" aria-live="polite">Signing in to your dashboard...</p>
      <span class="welcome__spinner" aria-hidden="true"></span>
    </div>
  </main>

  <script src="admin_welcome.js"></script>
</body>
</html>
