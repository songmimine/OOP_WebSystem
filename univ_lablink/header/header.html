<!--
  LPU Cavite – Laboratory Equipment System
  Global header component (markup only – no page body content).
  Loaded and wired up by header.js. Paths marked data-path / data-src are
  resolved by header.js relative to the univ_lablink root, so this fragment
  works from any subfolder (admin_dashboard, user_dashboard, login, ...).
-->
<header class="main-system-header" role="banner">

  <!-- A. Top utility bar -->
  <div class="msh-topbar">
    <div class="msh-brand">
      <a class="msh-brand-link" data-path="user_dashboard/user_dashboard.html" href="#" aria-label="LPU Cavite Laboratory Equipment System – home">
        <img class="msh-logo" data-src="assets/lpu-logo-black.png" src="" alt="Lyceum of the Philippines University Cavite" />
      </a>
      <span class="msh-divider" aria-hidden="true"></span>
      <span class="msh-title">Laboratory<br />Equipment System</span>
    </div>

    <form class="msh-search" role="search" action="#" method="get" autocomplete="off">
      <span class="msh-search-field">
        <svg class="msh-icon msh-search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m20 20-4.2-4.2"></path>
        </svg>
        <input
          class="msh-search-input"
          type="search"
          name="q"
          placeholder="Search equipment, requests, or ID..."
          aria-label="Search equipment, requests, or ID"
        />
      </span>
      <button class="msh-search-btn" type="submit">
        <span>Search</span>
        <svg class="msh-icon msh-arrow" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12h15"></path>
          <path d="m13 6 6 6-6 6"></path>
        </svg>
      </button>
    </form>

    <div class="msh-status">
      <div class="msh-datetime">
        <svg class="msh-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="2"></rect>
          <path d="M4 10h16M9 3v4M15 3v4"></path>
        </svg>
        <time class="msh-datetime-text" data-datetime>Loading...</time>
      </div>

      <button class="msh-bell" type="button" aria-label="Notifications">
        <svg class="msh-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"></path>
          <path d="M10 21a2 2 0 0 0 4 0"></path>
        </svg>
        <span class="msh-badge" data-notification-badge hidden>0</span>
      </button>

      <div class="msh-profile">
        <button
          class="msh-profile-btn"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="msh-profile-menu"
          data-profile-toggle
        >
          <svg class="msh-avatar" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4.2"></circle>
            <path d="M3.5 21c.6-4.4 4-6.6 8.5-6.6s7.9 2.2 8.5 6.6z"></path>
          </svg>
          <span class="msh-profile-label">Profile</span>
          <svg class="msh-icon msh-chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>

        <div class="msh-menu" id="msh-profile-menu" data-profile-menu hidden>
          <div class="msh-menu-user">
            <svg class="msh-menu-user-icon" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4.2a3.3 3.3 0 1 1 0 6.6 3.3 3.3 0 0 1 0-6.6zm0 13.1a8 8 0 0 1-6-2.7c.1-2 4-3.1 6-3.1s5.9 1.1 6 3.1a8 8 0 0 1-6 2.7z"></path>
            </svg>
            <div class="msh-menu-user-text">
              <span class="msh-menu-user-name" data-user-name>User</span>
              <span class="msh-menu-user-role" data-user-role>User</span>
            </div>
          </div>

          <ul class="msh-menu-list" role="menu">
            <li role="none">
              <a role="menuitem" data-path="user_welcome/profile.html" href="#">
                <svg class="msh-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9.5"></circle>
                  <circle cx="12" cy="9.6" r="3"></circle>
                  <path d="M6.2 18.2c1.2-2.2 3.3-3.3 5.8-3.3s4.6 1.1 5.8 3.3"></path>
                </svg>
                <span>My Profile</span>
              </a>
            </li>
            <li role="none">
              <a role="menuitem" data-path="user_dashboard/settings.html" href="#">
                <svg class="msh-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M12 2.8v2.5M12 18.7v2.5M2.8 12h2.5M18.7 12h2.5M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"></path>
                  <circle cx="12" cy="12" r="6.6"></circle>
                </svg>
                <span>Account Settings</span>
              </a>
            </li>
          </ul>

          <div class="msh-menu-footer">
            <a role="menuitem" class="msh-menu-logout" data-path="logout"" href="#" data-logout>
              <svg class="msh-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10"></path>
                <path d="M9 12h11"></path>
                <path d="m16 8 4 4-4 4"></path>
              </svg>
              <span>Log Out</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- B. Navigation bar -->
  <nav class="msh-nav" aria-label="Main navigation">
    <ul class="msh-nav-list">
      <li>
        <a class="msh-nav-link is-active" data-nav="dashboard" data-path="user_dashboard/user_dashboard.html" href="#" aria-current="page">
          <svg class="msh-icon msh-icon-solid" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 2.5 11.5h2.7V20h5v-5.5h3.6V20h5v-8.5h2.7z"></path>
          </svg>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a class="msh-nav-link" data-nav="about" data-path="user_welcome/index.html" href="#">
          <svg class="msh-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 11v5.5"></path>
            <circle class="msh-dot" cx="12" cy="7.8" r=".6"></circle>
          </svg>
          <span>About</span>
        </a>
      </li>
      <li>
        <a class="msh-nav-link" data-nav="requests" data-path="user_dashboard/requests.html" href="#">
          <svg class="msh-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="4" width="14" height="17" rx="2"></rect>
            <path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"></path>
          </svg>
          <span>My Requests</span>
        </a>
      </li>
      <li>
        <a class="msh-nav-link" data-nav="catalog" data-path="user_dashboard/catalog.html" href="#">
          <svg class="msh-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 3h6M10 3v6.2L4.8 18a2 2 0 0 0 1.7 3h11a2 2 0 0 0 1.7-3L14 9.2V3"></path>
            <path d="M7.5 15h9"></path>
          </svg>
          <span>Equipments Catalog</span>
        </a>
      </li>
      <li>
        <a class="msh-nav-link" data-nav="settings" data-path="user_dashboard/settings.html" href="#">
          <svg class="msh-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2.8v2.5M12 18.7v2.5M2.8 12h2.5M18.7 12h2.5M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"></path>
            <circle cx="12" cy="12" r="6.6"></circle>
          </svg>
          <span>Settings</span>
        </a>
      </li>
    </ul>
  </nav>

</header>
