<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Laboratory Equipment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="user_welcome.css">
</head>
<body>

  <!-- Top banner -->
  <header class="header">
    <img class="header__logo" src="../assets/lpu-logo-white.png" alt="Lyceum of the Philippines University Cavite">
    <span class="header__divider"></span>
    <span class="header__title">LABORATORY<br>EQUIPMENT SYSTEM</span>
  </header>

  <!-- Main content -->
  <main class="main">
    <div class="welcome">

      <!-- Erlenmeyer flask: light-gray glass + liquid that rises inside it -->
      <div class="lab-icon" aria-hidden="true">

        <!-- Layer 1 (behind): liquid, clipped to the flask's inner shape -->
        <svg class="lab-icon__layer lab-icon__liquid" viewBox="0 0 100 120">
          <defs>
            <clipPath id="flask-inside">
              <path d="M38 12V44L10 98Q6 108 18 108H82Q94 108 90 98L62 44V12Z"/>
            </clipPath>
          </defs>
          <g clip-path="url(#flask-inside)">
            <g class="liquid__rise">
              <!-- back wave (lighter) -->
              <g class="liquid__wave liquid__wave--back">
                <path fill="currentColor"
                      d="M0 2Q12.5 -8 25 2T50 2T75 2T100 2T125 2T150 2T175 2T200 2V150H0Z"/>
              </g>
              <!-- front wave -->
              <g class="liquid__wave">
                <path fill="currentColor"
                      d="M0 0Q12.5 8 25 0T50 0T75 0T100 0T125 0T150 0T175 0T200 0V150H0Z"/>
              </g>
            </g>
          </g>
        </svg>

        <!-- Layer 2 (front): empty glass outline -->
        <svg class="lab-icon__layer lab-icon__glass" viewBox="0 0 100 120">
          <rect x="28" y="4" width="44" height="8" rx="4" fill="currentColor"/>
          <path d="M38 12V44L10 98Q6 108 18 108H82Q94 108 90 98L62 44V12"
                fill="none" stroke="currentColor" stroke-width="6"
                stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 class="welcome__title">Welcome, User!</h1>
      <p class="welcome__subtitle">Successfully logging in to your dashboard...</p>
    </div>
  </main>

  <script src="user_welcome.js"></script>
</body>
</html>
