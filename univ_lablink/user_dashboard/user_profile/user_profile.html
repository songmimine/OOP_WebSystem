<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile | Laboratory Equipment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../portal-pages.css">
</head>
<body class="portal-page">
  <div id="lablink-header" data-active="settings"></div>
  <script src="../../header/header.js"></script>
  <main class="portal-main">
    <div class="portal-heading"><div><p class="portal-kicker">Account</p><h1>My Profile</h1><p>Update your contact details for this local demo.</p></div></div>
    <form class="portal-card" id="profile-form">
      <div class="portal-form-grid">
        <label class="portal-field"><span class="portal-label">Full name</span><input class="portal-input" id="profile-name" required></label>
        <label class="portal-field"><span class="portal-label">Student number</span><input class="portal-input" id="profile-id" required></label>
        <label class="portal-field"><span class="portal-label">Department</span><input class="portal-input" id="profile-department"></label>
        <label class="portal-field"><span class="portal-label">Email</span><input class="portal-input" id="profile-email" type="email"></label>
      </div>
      <div class="portal-actions" style="margin-top:18px"><button class="portal-button" type="submit">Save profile</button></div>
      <p class="portal-note" id="profile-status" role="status" hidden></p>
    </form>
  </main>
  <script src="user_profile.js"></script>
</body>
</html>
