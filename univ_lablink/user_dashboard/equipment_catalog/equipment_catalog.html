<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipment Catalog | Laboratory Equipment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../portal-pages.css">
  <link rel="stylesheet" href="equipment_catalog.css">
</head>
<body class="portal-page catalog-page">
  <div id="lablink-header" data-active="catalog"></div>
  <script src="../../header/header.js"></script>
  <main class="portal-main">
    <div class="portal-heading">
      <div>
        <p class="portal-kicker">Laboratory Inventory List</p>
        <h1>Equipments Catalog</h1>
        <p>Explore laboratory equipment, formulas, and chemicals.</p>
      </div>
    </div>
    <div class="catalog-toolbar">
      <label class="catalog-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"></circle><path d="m16 16 4.2 4.2"></path></svg>
        <input id="catalog-search" type="search" placeholder="Search by item name..." aria-label="Search equipment">
      </label>
      <label class="catalog-filter" aria-label="Filter by category">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 11h10M10 16h4"></path><path d="m5 3-2 3 2 3"></path></svg>
        <span>Filter:</span>
        <select id="catalog-category" aria-label="Equipment category">
          <option value="all">All categories</option>
        </select>
      </label>
    </div>
    <div class="catalog-categories" role="group" aria-label="Equipment categories">
      <span class="catalog-categories__label">Categories</span>
      <button class="catalog-category-chip is-active" type="button" data-category="all" aria-pressed="true">All</button>
    </div>
    <section class="catalog-table-card" id="catalog-grid" aria-label="Laboratory equipment inventory" aria-live="polite">
      <div class="portal-table-wrap">
        <table class="portal-table catalog-table">
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col">Category</th>
              <th scope="col">Location</th>
              <th scope="col">Availability</th>
              <th scope="col">Quantity</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="catalog-rows"></tbody>
        </table>
      </div>
    </section>
    <div class="catalog-selection" id="catalog-selection" hidden>
      <span id="catalog-selection-summary"></span>
      <a class="portal-button portal-button--small" href="../borrow_request_form/borrow_request_form.html">Continue to request</a>
    </div>
    <div class="portal-empty" id="catalog-empty" hidden>
      <h2>No matching equipment</h2>
      <p>Try a different search or category.</p>
    </div>
  </main>
  <p class="portal-toast" id="portal-toast" role="status" hidden></p>
  <script src="../../portal-store.js"></script>
  <script src="equipment_catalog.js"></script>
</body>
</html>
