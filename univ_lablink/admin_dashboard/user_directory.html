<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users &amp; Directory | University LabLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../portal-pages.css"><link rel="stylesheet" href="user_directory.css">
</head>
<body class="admin-portal-page">
  <div id="admin-header-mount" data-active="directory"></div>
  <main class="admin-content">
    <div class="portal-heading"><div><p class="portal-kicker">Accounts / Directory</p><h1>Users &amp; Directory</h1><p>Registered University LabLink accounts and their assigned account identifiers.</p></div></div>
    <section class="portal-card">
      <div class="portal-toolbar"><input class="portal-input" id="directory-search" type="search" aria-label="Search users" placeholder="Search user ID, name, email, or department"></div>
      <div class="portal-table-wrap"><table class="portal-table directory-table"><thead><tr><th>User ID</th><th>Full name</th><th>University email</th><th>Department</th><th>Role</th><th>Action</th></tr></thead><tbody id="directory-rows"><tr><td colspan="6">Loading accounts…</td></tr></tbody></table></div>
    </section>
    <dialog class="portal-modal directory-dialog" id="directory-dialog">
      <div class="portal-heading"><div><p class="portal-kicker">Account information</p><h2 id="directory-dialog-title"></h2></div><button class="portal-button portal-button--secondary portal-button--small" id="directory-close" type="button">Close</button></div>
      <div id="directory-dialog-body"></div>
    </dialog>
    <div id="admin-footer-mount"></div>
  </main>
  <p class="portal-toast" id="admin-toast" role="status" hidden></p>
  <script src="admin_pages.js"></script><script src="../admin_header/admin_header.js"></script><script src="../admin_footer/admin_footer.js"></script><script src="user_directory.js"></script>
</body>
</html>
