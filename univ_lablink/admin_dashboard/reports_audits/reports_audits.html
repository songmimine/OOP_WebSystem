<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports &amp; Audits | University LabLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../portal-pages.css"><link rel="stylesheet" href="reports_audits.css">
</head>
<body class="admin-portal-page">
  <div id="admin-header-mount" data-active="reports"></div>
  <main class="admin-content">
    <div class="portal-heading"><div><p class="portal-kicker">Records / Reports</p><h1>Reports &amp; Audits</h1><p>Browse current inventory, borrowing activity, completed returns, overdue loans, and recorded laboratory cases.</p></div></div>
    <section class="portal-grid report-summary" id="report-summary" aria-label="Database summary"></section>
    <section class="portal-card">
      <div class="report-toolbar">
        <label class="portal-field"><span class="portal-label">Report records</span><select class="portal-select" id="report-kind"><option value="transactions">Borrowing transactions</option><option value="equipment">Equipment inventory</option><option value="cases">Other cases</option></select></label>
        <label class="portal-field"><span class="portal-label">Filter status / type</span><select class="portal-select" id="report-filter"><option value="">All</option></select></label>
        <label class="portal-field report-search"><span class="portal-label">Search</span><input class="portal-input" id="report-search" type="search" placeholder="Search report records"></label>
        <div class="report-actions"><button class="portal-button" id="report-generate" type="button">Generate report</button><button class="portal-button portal-button--secondary" id="report-export" type="button">Export transactions CSV</button></div>
      </div>
      <div class="portal-table-wrap"><table class="portal-table report-table"><thead id="report-head"></thead><tbody id="report-rows"><tr><td>Generate a report to view current records.</td></tr></tbody></table></div>
    </section>
    <div id="admin-footer-mount"></div>
  </main>
  <p class="portal-toast" id="admin-toast" role="status" hidden></p>
  <script src="../admin_pages.js"></script><script src="../../admin_header/admin_header.js"></script><script src="../../admin_footer/admin_footer.js"></script><script src="reports_audits.js"></script>
</body>
</html>
