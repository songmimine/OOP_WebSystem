<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Records History | University LabLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../portal-pages.css"><link rel="stylesheet" href="records_history.css">
</head>
<body class="admin-portal-page">
  <div id="admin-header-mount" data-active="records"></div>
  <main class="admin-content">
    <div class="portal-heading"><div><p class="portal-kicker">Transactions / History</p><h1>Records History</h1><p>Completed and partially completed borrowing transactions, linked to the account that made each request.</p></div></div>
    <section class="portal-card">
      <div class="portal-toolbar"><input class="portal-input" id="history-search" type="search" aria-label="Search transaction history" placeholder="Search transaction, user ID, name, or equipment">
        <label class="portal-field"><span class="portal-label">Transaction status</span><select class="portal-select" id="history-status"><option value="">All statuses</option><option value="returned">Returned</option><option value="partially_returned">Partially returned</option><option value="damaged">Damaged</option><option value="lost">Lost</option></select></label>
      </div>
      <div class="portal-table-wrap"><table class="portal-table history-table"><thead><tr><th>Transaction ID</th><th>User ID</th><th>User name</th><th>Equipment / quantities</th><th>Borrowed</th><th>Due</th><th>Actual return</th><th>Status</th></tr></thead><tbody id="history-rows"><tr><td colspan="8">Loading records…</td></tr></tbody></table></div>
    </section>
    <div id="admin-footer-mount"></div>
  </main>
  <p class="portal-toast" id="admin-toast" role="status" hidden></p>
  <script src="admin_pages.js"></script><script src="../admin_header/admin_header.js"></script><script src="../admin_footer/admin_footer.js"></script><script src="records_history.js"></script>
</body>
</html>
