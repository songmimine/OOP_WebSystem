<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borrow Requests | University LabLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../portal-pages.css"><link rel="stylesheet" href="borrow_requests.css">
</head>
<body class="admin-portal-page">
  <div id="admin-header-mount" data-active="requests"></div>
  <main class="admin-content">
    <div class="portal-heading"><div><p class="portal-kicker">Requests / Review</p><h1>User Requests Management</h1><p>Review submitted requests, validate available quantities, and separately record equipment release.</p></div></div>
    <section class="portal-card" aria-label="Borrow request filters">
      <div class="portal-toolbar"><input class="portal-input" id="request-search" type="search" placeholder="Search request, user, equipment, or purpose" aria-label="Search requests">
        <label class="portal-field"><span class="portal-label">Status</span><select class="portal-select" id="request-status"><option value="all">All requests</option><option value="pending">Pending</option><option value="approved">Approved / awaiting release</option><option value="rejected">Rejected</option><option value="cancelled">Cancelled</option><option value="active">Released / borrowed</option><option value="returned">Returned</option></select></label>
      </div>
      <div class="portal-table-wrap"><table class="portal-table request-table"><thead><tr><th>Request</th><th>User</th><th>Equipment / quantity</th><th>Purpose</th><th>Requested dates</th><th>Status</th><th>Actions</th></tr></thead><tbody id="request-rows"><tr><td colspan="7">Loading requests…</td></tr></tbody></table></div>
    </section>
    <dialog class="portal-modal request-dialog" id="request-dialog">
      <div class="portal-heading"><div><p class="portal-kicker">Request details</p><h2 id="request-dialog-title"></h2></div><button class="portal-button portal-button--secondary portal-button--small" id="request-dialog-close" type="button">Close</button></div>
      <div id="request-dialog-body"></div>
    </dialog>
    <div id="admin-footer-mount"></div>
  </main>
  <p class="portal-toast" id="admin-toast" role="status" hidden></p>
  <script src="../admin_pages.js"></script><script src="../../admin_header/admin_header.js"></script><script src="../../admin_footer/admin_footer.js"></script><script src="borrow_requests.js"></script>
</body>
</html>
