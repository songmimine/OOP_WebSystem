<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratory Settings | University LabLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../portal-pages.css"><link rel="stylesheet" href="settings.css">
</head>
<body class="admin-portal-page">
  <div id="admin-header-mount" data-active="settings"></div>
  <main class="admin-content">
    <div class="portal-heading"><div><p class="portal-kicker">Administration / Settings</p><h1>Laboratory Information &amp; Settings</h1><p>Maintain the contact details and borrowing policies displayed by the system.</p></div></div>
    <form class="portal-card portal-form-grid settings-form" id="settings-form">
      <label class="portal-field"><span class="portal-label">Lead laboratory office</span><input class="portal-input" name="office" required maxlength="120"></label>
      <label class="portal-field"><span class="portal-label">General contact number</span><input class="portal-input" name="phone" maxlength="60"></label>
      <label class="portal-field"><span class="portal-label">Email address</span><input class="portal-input" name="email" type="email" maxlength="160"></label>
      <label class="portal-field"><span class="portal-label">Operating hours</span><input class="portal-input" name="hours" maxlength="180"></label>
      <label class="portal-field"><span class="portal-label">Borrowing rules</span><textarea class="portal-textarea" name="rules" maxlength="1000"></textarea></label>
      <label class="portal-field"><span class="portal-label">Extension policy</span><textarea class="portal-textarea" name="extension" maxlength="500"></textarea></label>
      <div class="portal-field--wide settings-actions"><button class="portal-button" id="settings-save" type="submit">Save changes</button><p class="portal-note" id="settings-result" role="status" hidden></p></div>
    </form>
    <div id="admin-footer-mount"></div>
  </main>
  <p class="portal-toast" id="admin-toast" role="status" hidden></p>
  <script src="admin_pages.js"></script><script src="../admin_header/admin_header.js"></script><script src="../admin_footer/admin_footer.js"></script><script src="settings.js"></script>
</body>
</html>
